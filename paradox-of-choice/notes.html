<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>הערות דובר - פרדוקס הבחירה</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <style>
    :root { --orange:#FF4500; --yellow:#FFC233; --pink:#EF3054; --blue:#3928FF; --grey:#CDD0D6; --black:#101010; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--grey); color: var(--black); font-family: 'Heebo', sans-serif; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 56px 24px 80px; }
    header { background: var(--orange); color: var(--grey); border-radius: 36px; padding: 40px 44px 46px; margin-bottom: 28px; }
    header h1 { margin: 0; font-weight: 900; font-size: 76px; line-height: .9; }
    header p { margin: 16px 0 0; font-size: 19px; color: var(--black); }
    .mono { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: .05em; }
    section { background: #fff; border-radius: 28px; padding: 28px 34px 22px; margin-bottom: 16px; break-inside: avoid; }
    .top { display: flex; align-items: baseline; gap: 16px; margin-bottom: 10px; }
    .num { font-weight: 900; font-size: 48px; line-height: 1; color: var(--orange); direction: ltr; }
    h2 { margin: 0; font-size: 26px; font-weight: 800; flex: 1; }
    .time { background: var(--black); color: var(--yellow); border-radius: 999px; padding: 4px 14px 6px; font-size: 14px; font-weight: 700; white-space: nowrap; }
    p.n { font-size: 19px; line-height: 1.65; margin: 0 0 10px; }
    p.cue { border-right: 4px solid var(--blue); padding-right: 12px; }
    p.cue b { color: var(--blue); }
    @media print { body { background: #fff; } section { border: 1px solid #ccc; } header { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="mono">SPEAKER NOTES - THE PARADOX OF CHOICE</div>
      <h1>הערות דובר</h1>
      <p>10 שקפים · כ־5-7 דקות · "לחיצה" = לחיצה על רווח / חץ ימינה בתוך השקף (שלב פנימי).</p>
    </header>
    <div id="list"></div>
  </div>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/htm.umd.js"></script>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/CustomEase.min.js"></script>
  <script src="src/lib.js"></script>
  <script src="src/transitions.js"></script>
  <script src="src/slides/s01.js"></script>
  <script src="src/slides/s02.js"></script>
  <script src="src/slides/s03.js"></script>
  <script src="src/slides/s04.js"></script>
  <script src="src/slides/s05.js"></script>
  <script src="src/slides/s06.js"></script>
  <script src="src/slides/s07.js"></script>
  <script src="src/slides/s08.js"></script>
  <script src="src/slides/s09.js"></script>
  <script src="src/slides/s10.js"></script>
  <script src="src/notes.js"></script>
  <script>
    const esc = (t) => t.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    document.getElementById('list').innerHTML = P.notes.map((n, i) => `
      <section>
        <div class="top"><div class="num">${String(i + 1).padStart(2, '0')}</div><h2>${esc(P.slides[i].title)}</h2><span class="time">${esc(n.time)}</span></div>
        ${n.text.map((p) => p.startsWith('[לחיצה]')
          ? `<p class="n cue"><b>לחיצה ▸</b>${esc(p.replace('[לחיצה]', ''))}</p>`
          : `<p class="n">${esc(p)}</p>`).join('')}
      </section>`).join('');
  </script>
</body>
</html>
